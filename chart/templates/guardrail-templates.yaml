{{- if and .Values.deploy.enabled (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
{{- $guarded := "has(namespaceObject.metadata.labels) && namespaceObject.metadata.labels.exists(k, k.endsWith('/app-template'))" }}
# Namespaces the Templates page deploys into carry a "<label domain>/app-template"
# label and Pod Security "baseline", which the API server enforces on pods.
# These policies hold the same line one level up, for every client including
# the installer account: a workload or RoleBinding that breaks it is refused
# when it is applied, not when its pods fail to start.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "app.clusterName" . }}-templates-workloads
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: guarded
      expression: {{ $guarded | quote }}
    - name: pod
      expression: "object.spec.template.spec"
  validations:
    - expression: "!variables.guarded || !has(variables.pod.volumes) || variables.pod.volumes.all(v, !has(v.hostPath))"
      message: "Template apps may not mount a directory of the node (hostPath)."
      reason: Forbidden
    - expression: >-
        !variables.guarded ||
        !(has(variables.pod.hostNetwork) && variables.pod.hostNetwork) &&
        !(has(variables.pod.hostPID) && variables.pod.hostPID) &&
        !(has(variables.pod.hostIPC) && variables.pod.hostIPC)
      message: "Template apps may not use the node's network, processes or IPC."
      reason: Forbidden
    - expression: >-
        !variables.guarded ||
        variables.pod.containers.all(c, !has(c.securityContext) ||
          ((!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
           (!has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation))) &&
        (!has(variables.pod.initContainers) || variables.pod.initContainers.all(c, !has(c.securityContext) ||
          ((!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
           (!has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation))))
      message: "Template apps may not run privileged or allow privilege escalation."
      reason: Forbidden
    - expression: >-
        !variables.guarded ||
        variables.pod.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) &&
        (!has(variables.pod.initContainers) || variables.pod.initContainers.all(c, !has(c.ports) ||
          c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))
      message: "Template apps may not open ports on the node itself (hostPort)."
      reason: Forbidden
    - expression: >-
        !variables.guarded ||
        variables.pod.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap, cap in ["AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER",
            "FSETID", "KILL", "MKNOD", "NET_BIND_SERVICE", "SETFCAP", "SETGID", "SETPCAP", "SETUID", "SYS_CHROOT"]))
      message: "Template apps may only add the capabilities Pod Security baseline allows."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "app.clusterName" . }}-templates-workloads
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  policyName: {{ include "app.clusterName" . }}-templates-workloads
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "app.clusterName" . }}-templates-rbac
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings", "roles"]
  variables:
    - name: guarded
      expression: {{ $guarded | quote }}
  validations:
    - expression: >-
        !variables.guarded ||
        object.kind != 'RoleBinding' ||
        !(object.roleRef.kind == 'ClusterRole' && object.roleRef.name in ['cluster-admin', 'admin', 'edit'])
      message: "Template apps may not bind the cluster-admin, admin or edit ClusterRole."
      reason: Forbidden
    - expression: >-
        !variables.guarded ||
        object.kind != 'Role' || !has(object.rules) || object.rules.all(r,
          !('*' in r.verbs) && (!has(r.resources) || !('*' in r.resources)) &&
          (!has(r.apiGroups) || !('*' in r.apiGroups)))
      message: "Template apps may not grant \"*\" in a Role."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "app.clusterName" . }}-templates-rbac
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  policyName: {{ include "app.clusterName" . }}-templates-rbac
  validationActions: ["Deny"]
{{- end }}
