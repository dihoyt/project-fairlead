name: install-test

on:
  pull_request:
    paths:
      - install.sh
      - update.sh
      - add-node.sh
      - scripts/install/**
      - chart/**
      - Dockerfile
      - .github/workflows/install-test.yml
  push:
    branches: [main, next]
    paths:
      - install.sh
      - update.sh
      - add-node.sh
      - scripts/install/**
      - chart/**
      - Dockerfile
      - .github/workflows/install-test.yml

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh update.sh add-node.sh scripts/install/*.sh
      - if: ${{ !cancelled() }}
        run: scripts/install/gen-scripts.sh --check
      - if: ${{ !cancelled() }}
        run: scripts/install/check-pins.sh install.sh

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: echo "image=$(jq -r '.imageRegistry + "/" + .imageName' product.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.names.outputs.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  # A runner with no cluster: the installer installs k3s and Helm itself.
  k3s:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Names and a clean host
        run: |
          echo "NS=$(jq -r .defaultNamespace product.json)" >> "$GITHUB_ENV"
          echo "RELEASE=$(jq -r .slug product.json)" >> "$GITHUB_ENV"
          # k3s imports these at start, so the pod never pulls from a registry.
          sudo mkdir -p /var/lib/rancher/k3s/agent/images
          sudo cp "$RUNNER_TEMP/image.tar" /var/lib/rancher/k3s/agent/images/
          sudo rm -f "$(command -v helm)"
          # Without a kubectl of its own the k3s installer links kubectl to k3s,
          # as on a fresh host.
          ! kubectl get --raw /readyz --request-timeout=5s
          sudo rm -f "$(command -v kubectl)"
      - name: First install, piped as curl | sh would
        run: |
          # The log keeps the password out of the job output, which is public with the repo.
          cat install.sh | sh -s -- --yes --chart ./chart --image-tag ci > "$RUNNER_TEMP/first.log" \
            || { sed 's/^Password: .*/Password: (redacted)/' "$RUNNER_TEMP/first.log"; exit 1; }
          sed 's/^Password: .*/Password: (redacted)/' "$RUNNER_TEMP/first.log"
          password=$(sed -n 's/^Password: //p' "$RUNNER_TEMP/first.log")
          [ -n "$password" ] || { echo "first install printed no password"; exit 1; }
          echo "::add-mask::$password"
          echo "PASSWORD=$password" >> "$GITHUB_ENV"
          scripts/install/assert-install.sh "$RUNNER_TEMP/first.log" "$password"
          grep -q '^URL: http://.*:32450/$' "$RUNNER_TEMP/first.log" || { echo "not served on NodePort 32450"; exit 1; }
          # Longhorn's node prerequisites, installed on this host's k3s node.
          command -v iscsiadm mount.nfs
          systemctl is-active iscsid
          # The k3s installed is the stable channel's newest release, not the fallback pin.
          stable=$(curl -fsS -o /dev/null -w '%{redirect_url}' https://update.k3s.io/v1-release/channels/stable | sed 's|.*/||; s/%2[Bb]/+/')
          grep -q "^Installing k3s $stable " "$RUNNER_TEMP/first.log" || { echo "expected k3s $stable"; exit 1; }
          k3s --version | grep -qF "$stable" || { echo "k3s is not $stable"; exit 1; }
          sudo k3s kubectl -n "$NS" get secret "$RELEASE-secrets" -o jsonpath='{.metadata.uid}{.data}' > "$RUNNER_TEMP/secret.before"
      - name: Re-run as root upgrades in place and keeps the password
        run: |
          # As root, k3s's kubectl reaches the cluster with no kubeconfig while
          # helm does not: the installer must hand both k3s.yaml.
          [ "$(readlink -f "$(command -v kubectl)")" = "$(readlink -f "$(command -v k3s)")" ]
          sudo sh install.sh --yes --chart ./chart | tee "$RUNNER_TEMP/second.log"
          grep -q "^Using this host's k3s" "$RUNNER_TEMP/second.log"
          ! grep -q '^Password:' "$RUNNER_TEMP/second.log" || { echo "re-run printed the password"; exit 1; }
          sudo k3s kubectl -n "$NS" get secret "$RELEASE-secrets" -o jsonpath='{.metadata.uid}{.data}' > "$RUNNER_TEMP/secret.after"
          cmp -s "$RUNNER_TEMP/secret.before" "$RUNNER_TEMP/secret.after" || { echo "re-run changed the Secret"; exit 1; }
          [ "$(sudo helm --kubeconfig /etc/rancher/k3s/k3s.yaml history "$RELEASE" -n "$NS" -o json | jq length)" = 2 ]
          scripts/install/assert-install.sh "$RUNNER_TEMP/second.log" "$PASSWORD"
      - name: update.sh upgrades in place and keeps the settings
        run: |
          sh update.sh --yes --chart ./chart --k3s --prereqs | tee "$RUNNER_TEMP/update.log"
          grep -q '^k3s is already ' "$RUNNER_TEMP/update.log"
          grep -q '^Chart: .* -> ' "$RUNNER_TEMP/update.log"
          grep -q '^Image: .* -> ' "$RUNNER_TEMP/update.log"
          grep -q '^URL: http://.*:32450/$' "$RUNNER_TEMP/update.log" || { echo "update moved the port"; exit 1; }
          ! grep -q '^Password' "$RUNNER_TEMP/update.log"
          # The join values for the console's node join links, from this k3s server.
          [ "$(sudo k3s kubectl -n "$NS" get secret k3s-join -o jsonpath='{.data.token}' | base64 -d)" = "$(sudo cat /var/lib/rancher/k3s/server/node-token)" ]
          sudo k3s kubectl -n "$NS" get secret k3s-join -o jsonpath='{.data.server-url}' | base64 -d | grep -q '^https://.*:6443$'
          ! grep -q "$(sudo cat /var/lib/rancher/k3s/server/node-token)" "$RUNNER_TEMP/first.log" "$RUNNER_TEMP/update.log"
          [ "$(sudo helm --kubeconfig /etc/rancher/k3s/k3s.yaml history "$RELEASE" -n "$NS" -o json | jq length)" = 3 ]
          scripts/install/assert-install.sh "$RUNNER_TEMP/update.log" "$PASSWORD"
          # No release to update: it says so and points at install.sh.
          ! sh update.sh --yes --chart ./chart --release absent 2> "$RUNNER_TEMP/absent.err"
          grep -q 'install it with install.sh' "$RUNNER_TEMP/absent.err"
      - name: Uninstall removes the release and leaves k3s
        run: |
          sh install.sh --yes --uninstall
          ! sudo helm --kubeconfig /etc/rancher/k3s/k3s.yaml status "$RELEASE" -n "$NS"
          systemctl is-active k3s
          sudo k3s kubectl -n "$NS" get secret "$RELEASE-secrets" > /dev/null
      - name: Diagnostics
        if: failure()
        run: |
          sudo k3s kubectl get nodes,pods -A -o wide || true
          sudo k3s kubectl -n "$NS" get all,pvc,events || true
          sudo k3s kubectl -n "$NS" logs "deploy/$RELEASE" --tail=100 || true
          sudo journalctl -u k3s --no-pager | tail -n 50 || true

  # An existing cluster: the installer uses the current context and skips k3s.
  kind:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same minor as the k3s that install.sh pins as its fallback.
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: kind
      - name: Install into kind
        run: |
          echo "NS=$(jq -r .defaultNamespace product.json)" >> "$GITHUB_ENV"
          echo "RELEASE=$(jq -r .slug product.json)" >> "$GITHUB_ENV"
          kind load image-archive "$RUNNER_TEMP/image.tar"
          ./install.sh --no-k3s --yes --chart ./chart --image-tag ci > "$RUNNER_TEMP/kind.log" \
            || { sed 's/^Password: .*/Password: (redacted)/' "$RUNNER_TEMP/kind.log"; exit 1; }
          sed 's/^Password: .*/Password: (redacted)/' "$RUNNER_TEMP/kind.log"
          ! grep -qi 'installing k3s' "$RUNNER_TEMP/kind.log"
          grep -q '^Not on a k3s server node' "$RUNNER_TEMP/kind.log"
          password=$(sed -n 's/^Password: //p' "$RUNNER_TEMP/kind.log")
          echo "::add-mask::$password"
          scripts/install/assert-install.sh "$RUNNER_TEMP/kind.log" "$password"
          grep -q '^URL: http://.*:32450/$' "$RUNNER_TEMP/kind.log" || { echo "not served on NodePort 32450"; exit 1; }
      - name: Deploys stay off until --enable-deploy turns them on
        run: |
          sa="system:serviceaccount:$NS:$RELEASE"
          [ "$(kubectl auth can-i create jobs -n "$NS" --as="$sa" || true)" = no ]
          ./install.sh --no-k3s --yes --chart ./chart --enable-deploy | tee "$RUNNER_TEMP/deploy.log"
          grep -q '^App deploys are on' "$RUNNER_TEMP/deploy.log"
          [ "$(kubectl auth can-i create jobs -n "$NS" --as="$sa")" = yes ]
          kubectl -n "$NS" get serviceaccount "$RELEASE-installer" > /dev/null
          # A re-run without the flag keeps them on.
          ./install.sh --no-k3s --yes --chart ./chart > /dev/null
          [ "$(kubectl auth can-i create jobs -n "$NS" --as="$sa")" = yes ]
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$NS" get all,pvc,events || true
          kubectl -n "$NS" logs "deploy/$RELEASE" --tail=100 || true
