name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          name=$(jq -r .imageName product.json)
          registry=$(jq -r .imageRegistry product.json)
          echo "image=$registry/$name" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint and render
        run: |
          helm lint chart --set secrets.create=true --set secrets.values.SECRETS_KEY=x
          helm template r chart --namespace ns > /dev/null
          helm template r chart --namespace ns --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=a.example.test' --set networkPolicy.enabled=true \
            --set rbac.secrets.enabled=true --set 'rbac.secrets.namespaces={a,b}' > /dev/null
          chart/ci/deploy-optin.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.names.outputs.image }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same minor as the k3s that install.sh pins as its fallback.
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          cluster_name: kind
      - name: Load image and run chart smoke test
        run: |
          kind load docker-image "${{ steps.names.outputs.image }}:ci"
          chart/ci/smoke.sh "${{ steps.names.outputs.image }}" ci

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.chart.outputs.image }}:${{ github.sha }}
            ${{ needs.chart.outputs.image }}:edge
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Package and push chart
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: //p' chart/Chart.yaml)
          helm package chart --version "$base-edge.${{ github.run_number }}" --app-version "${{ github.sha }}" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP"/*.tgz "oci://ghcr.io/$owner/charts"
